<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uğur İletişim - Personel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .description {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 18px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            background: #111827;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .code-box {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #f3f4f6;
            border-radius: 18px;
            text-align: center;
        }

        .code {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 8px;
            margin: 10px 0;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
        }

        .timer {
            margin-top: 12px;
            font-size: 17px;
        }

        .error {
            color: #b91c1c;
            text-align: center;
            margin-top: 15px;
        }

        .expired {
            color: #b91c1c;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Uğur İletişim</h1>

        <p class="description">
            Personel Damga Kodu Oluştur
        </p>


        <label for="amount">
            Alışveriş Tutarı
        </label>

        <input
            id="amount"
            type="number"
            min="1"
            step="0.01"
            inputmode="decimal"
            placeholder="Örn: 500"
        >


        <label for="adminPin">
            Personel Şifresi
        </label>

        <input
            id="adminPin"
            type="password"
            maxlength="4"
            inputmode="numeric"
            placeholder="••••"
        >


        <button id="createButton">
            Kod Oluştur
        </button>


        <div id="error" class="error"></div>


        <div id="codeBox" class="code-box">

            <div class="amount" id="showAmount"></div>

            <div class="code" id="code"></div>

            <div class="timer" id="timer">
                60 saniye geçerli
            </div>

        </div>

    </div>

</div>


<script src="config.js"></script>

<script>

const config = window.DAMGA_CONFIG || {};

let timerInterval = null;


async function createCode() {

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const adminPin =
        document.getElementById("adminPin")
            .value
            .trim();

    const error =
        document.getElementById("error");

    const button =
        document.getElementById("createButton");


    error.textContent = "";


    if (!amount || amount <= 0) {

        error.textContent =
            "Geçerli bir alışveriş tutarı girin.";

        return;

    }


    if (!/^\d{4}$/.test(adminPin)) {

        error.textContent =
            "4 haneli personel şifresini girin.";

        return;

    }


    button.disabled = true;
    button.textContent = "Kod oluşturuluyor...";


    try {

        const response = await fetch(

            `${config.SUPABASE_URL}/rest/v1/rpc/create_stamp_code`,

            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": config.SUPABASE_ANON_KEY,
                    "Authorization":
                        `Bearer ${config.SUPABASE_ANON_KEY}`
                },

                body: JSON.stringify({
                    p_amount: amount,
                    p_admin_pin: adminPin
                })
            }

        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Kod oluşturulamadı."
            );

        }


        document.getElementById("code")
            .textContent = data;


        document.getElementById("showAmount")
            .textContent =
            `${amount.toLocaleString("tr-TR")} TL alışveriş`;


        document.getElementById("codeBox")
            .style.display = "block";


        startTimer();


    } catch (err) {

        error.textContent =
            err.message;

    }


    button.disabled = false;
    button.textContent = "Yeni Kod Oluştur";

}


function startTimer() {

    clearInterval(timerInterval);

    let seconds = 60;

    const timer =
        document.getElementById("timer");


    timer.classList.remove("expired");

    timer.textContent =
        `${seconds} saniye geçerli`;


    timerInterval = setInterval(() => {

        seconds--;


        if (seconds <= 0) {

            clearInterval(timerInterval);

            timer.textContent =
                "Kodun süresi doldu";

            timer.classList.add("expired");

            document.getElementById("code")
                .textContent = "----";

            return;

        }


        timer.textContent =
            `${seconds} saniye geçerli`;

    }, 1000);

}


document.getElementById("createButton")
    .addEventListener(
        "click",
        createCode
    );

</script>

</body>
</html>
